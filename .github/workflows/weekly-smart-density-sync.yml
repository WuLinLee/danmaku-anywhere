name: Sync Official Upstream

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
  # Validate this workflow immediately when its own logic changes.
  push:
    branches:
      - master
    paths:
      - .github/workflows/weekly-smart-density-sync.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: official-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the customization branch
        uses: actions/checkout@v4
        with:
          ref: danmaku-customizations
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official upstream
        run: |
          git remote add upstream https://github.com/Danmaku-Anywhere/danmaku-anywhere.git
          git fetch upstream master

      - name: Merge upstream changes into the customization branch
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/master)"

          # Track the last upstream snapshot explicitly. This fork uses synthetic
          # one-parent sync commits, so the marker is the authoritative merge base.
          if [ -f .github/upstream-sync-commit ]; then
            previous_upstream_sha="$(tr -d '\r\n' < .github/upstream-sync-commit)"
            if ! git cat-file -e "${previous_upstream_sha}^{commit}" 2>/dev/null; then
              echo "::warning::The recorded upstream base is unavailable; falling back to the Git merge base."
              previous_upstream_sha="$(git merge-base "$before" "$upstream_sha")"
            fi
          else
            previous_upstream_sha="$(git merge-base "$before" "$upstream_sha")"
          fi

          if [ -z "$previous_upstream_sha" ] || ! git cat-file -e "${previous_upstream_sha}^{commit}" 2>/dev/null; then
            echo "::error::Could not determine a valid previous upstream commit."
            exit 1
          fi

          if [ "$previous_upstream_sha" = "$upstream_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Customization branch is already synchronized."
            exit 0
          fi

          # The customization branch owns its GitHub Actions workflows. Neutralize
          # that directory on the temporary merge input so upstream workflow edits
          # cannot conflict with this fork's intentional removals/custom build.
          # The real branch workflows are restored after the source merge.
          tmp_index="$(mktemp)"
          rm -f "$tmp_index"
          trap 'rm -f "$tmp_index" "$tmp_index.lock"' EXIT

          GIT_INDEX_FILE="$tmp_index" git read-tree "$before"
          GIT_INDEX_FILE="$tmp_index" git rm -r --cached --ignore-unmatch .github/workflows >/dev/null
          if git cat-file -e "${previous_upstream_sha}:.github/workflows" 2>/dev/null; then
            GIT_INDEX_FILE="$tmp_index" git read-tree --prefix=.github/workflows/ "${previous_upstream_sha}:.github/workflows"
          fi
          merge_ours_tree="$(GIT_INDEX_FILE="$tmp_index" git write-tree)"
          rm -f "$tmp_index" "$tmp_index.lock"
          trap - EXIT

          # git merge-tree accepts commits, so wrap the adjusted tree in a
          # temporary commit. It is never pushed; the final sync commit keeps
          # the customization branch's normal one-parent history.
          merge_ours_commit="$(git commit-tree "$merge_ours_tree" -p "$before" -m "temporary upstream sync input")"

          # This one-time bootstrap is allowed only for the exact upstream range
          # whose conflicting UI/locale files were manually rebased onto the current
          # upstream snapshot on the customization branch. No later sync may use it.
          merge_strategy_args=()
          if [ "$previous_upstream_sha" = "0e228ffe023e6624ecafaca3f705e8882a7a2b87" ] &&
             [ "$upstream_sha" = "6f3bad135023415bc713e1fc0cc3907f0d2ef120" ]; then
            echo "::notice::Using the reviewed one-time bootstrap merge preference for the manually reconciled files."
            merge_strategy_args=(-X ours)
          fi

          # Future syncs use Git's normal merge. Never silently prefer either side:
          # on an unexpected source conflict, print diagnostics and stop for review.
          if merge_output="$(git merge-tree --write-tree --merge-base="$previous_upstream_sha" "${merge_strategy_args[@]}" "$merge_ours_commit" "$upstream_sha" 2>&1)"; then
            :
          else
            merge_status=$?
            echo "::error::Upstream source changes could not be merged automatically (exit $merge_status)." >&2
            echo "Full git merge-tree diagnostics:" >&2
            printf '%s\n' "$merge_output" >&2
            exit "$merge_status"
          fi

          merged_tree="${merge_output%%$'\n'*}"
          if ! git cat-file -e "${merged_tree}^{tree}" 2>/dev/null; then
            echo "::error::git merge-tree did not return a valid tree object." >&2
            printf '%s\n' "$merge_output" >&2
            exit 1
          fi

          git read-tree --reset -u "$merged_tree"

          # Restore every fork-owned workflow exactly as it existed before sync.
          git checkout "$before" -- .github/workflows
          printf '%s\n' "$upstream_sha" > .github/upstream-sync-commit
          git add -A

          final_tree="$(git write-tree)"
          if git diff --quiet "$before" "$final_tree"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No source changes to commit."
            exit 0
          fi

          short_sha="$(printf '%s' "$upstream_sha" | cut -c1-12)"
          new_commit="$(git commit-tree "$final_tree" -p "$before" -m "chore: sync upstream master at $short_sha")"
          git reset --hard "$new_commit"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Prepared upstream sync commit $new_commit."
          
      - name: Push synchronized source
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:danmaku-customizations

      # GITHUB_TOKEN pushes don't start a second workflow, so explicitly start the
      # single build-and-publish workflow after the source branch is up to date.
      - name: Build and publish the updated preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run smart-density-build.yml --repo "$GITHUB_REPOSITORY" --ref danmaku-customizations
