name: Sync Official Upstream

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
  # Validate this workflow immediately when its own logic changes.
  push:
    branches:
      - master
    paths:
      - .github/workflows/weekly-smart-density-sync.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: official-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the customization branch
        uses: actions/checkout@v4
        with:
          ref: danmaku-customizations
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch official upstream
        run: |
          git remote add upstream https://github.com/Mr-Quin/danmaku-anywhere.git
          git fetch upstream master

      - name: Merge upstream changes into the customization branch
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse upstream/master)"

          # Track the upstream snapshot separately so the fork keeps its own workflows.
          if [ -f .github/upstream-sync-commit ]; then
            previous_upstream_sha="$(tr -d '\r\n' < .github/upstream-sync-commit)"
            if ! git cat-file -e "${previous_upstream_sha}^{commit}" 2>/dev/null; then
              previous_upstream_sha="$(git merge-base "$before" "$upstream_sha")"
            fi
          else
            previous_upstream_sha="$(git merge-base "$before" "$upstream_sha")"
          fi

          if [ "$previous_upstream_sha" = "$upstream_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Customization branch is already synchronized."
            exit 0
          fi

          merged_tree="$(git merge-tree --write-tree --merge-base="$previous_upstream_sha" -X ours "$before" "$upstream_sha")"
          git read-tree --reset -u "$merged_tree"

          # Keep the fork's automation instead of importing upstream workflow files.
          git checkout "$before" -- .github/workflows
          printf '%s\n' "$upstream_sha" > .github/upstream-sync-commit
          git add -A

          final_tree="$(git write-tree)"
          if git diff --quiet "$before" "$final_tree"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No source changes to commit."
            exit 0
          fi

          short_sha="$(printf '%s' "$upstream_sha" | cut -c1-12)"
          new_commit="$(git commit-tree "$final_tree" -p "$before" -m "chore: sync upstream master at $short_sha")"
          git reset --hard "$new_commit"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Prepared upstream sync commit $new_commit."

      - name: Push synchronized source
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:danmaku-customizations

      # GITHUB_TOKEN pushes don't start a second workflow, so explicitly start the
      # single build-and-publish workflow after the source branch is up to date.
      - name: Build and publish the updated preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run smart-density-build.yml --ref danmaku-customizations
