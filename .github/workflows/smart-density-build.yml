name: Smart Danmaku Density Build

on:
  push:
    branches:
      - smart-danmaku-density
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-chrome:
    runs-on: ubuntu-latest
    env:
      VITE_PROXY_URL: ${{ vars.VITE_PROXY_URL || 'https://api.danmaku-staging.weeblify.app' }}
      VITE_PROXY_ORIGIN: ${{ vars.VITE_PROXY_ORIGIN || 'https://danmaku.weeblify.app' }}
      VERSION_SUFFIX: ${{ github.run_number }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Test density algorithm
        run: pnpm --filter @danmaku-anywhere/danmaku-engine test

      - name: Type-check extension
        run: pnpm --filter @mr-quin/danmaku-anywhere type-check

      - name: Build and package Chrome extension
        working-directory: packages/danmaku-anywhere
        run: |
          pnpm build
          pnpm package

      - name: Prepare a stable Release filename
        shell: bash
        run: |
          set -euo pipefail
          source_zip="$(find packages/danmaku-anywhere/package -maxdepth 1 -type f -name '*-chrome.zip' -print -quit)"
          test -n "$source_zip"
          mkdir -p release-assets
          cp "$source_zip" release-assets/smart-danmaku-density-chrome.zip

      - name: Upload installable extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: smart-danmaku-density-chrome
          path: release-assets/smart-danmaku-density-chrome.zip
          if-no-files-found: error
          retention-days: 14

      - name: Point preview tag at this build
        run: |
          set -euo pipefail
          commit_sha="$(git rev-parse HEAD)"
          git tag -f smart-danmaku-density-preview "$commit_sha"
          git push origin refs/tags/smart-danmaku-density-preview --force

      - name: Publish ZIP to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smart-danmaku-density-preview
          name: Smart Danmaku Density Preview
          body: |
            Automated preview build for the smart-danmaku-density branch.

            The attached Chrome extension is rebuilt weekly from the latest official
            upstream master, with the smart density patch merged on top.
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/smart-danmaku-density-chrome.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete stale assets from the same Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            [ "$asset" = "smart-danmaku-density-chrome.zip" ] && continue
            gh release delete-asset smart-danmaku-density-preview "$asset" --yes
          done < <(gh release view smart-danmaku-density-preview --json assets --jq '.assets[].name')
